<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Միննա の 語彙</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- exactly two families at exactly two weights: Noto Sans JP for body text,
       Shippori Mincho for headings and Japanese. Nothing else is used. -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Shippori+Mincho:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=49" />
</head>
<body data-view="home">
  <!-- ===== Top bar ===== -->
  <header class="topbar">
    <div class="topbar__left">
      <label class="lang" >
        <select id="langSelect" aria-label="Translation language">
          <option value="en">English</option>
          <option value="ru">Русский</option>
          <option value="hy">Հայերեն</option>
        </select>
      </label>
    </div>

    <div class="topbar__right">
      <button class="pill" id="navFlashcards"><span data-i18n="flashcards">Flashcards</span></button>
      <button class="pill pill--ghost" id="navLessons"><span data-i18n="lessons">Lessons</span></button>

      <!-- same account as the kanji site; shows your picture once signed in -->
      <button class="acc-tab" id="accTab" aria-label="Account" title="Account">☺</button>

      <!-- Two sister sites, two flowers. The one you are on sits big in front;
           the other tucks into its bottom-right corner. Tapping the small one
           swaps them, then hands over to that site. -->
      <div class="sites" id="siteSwitch">
        <button class="sites__here" id="brandBtn" title="Միննա の 語彙 — home" aria-label="Home">
          <img src="favicon.svg" alt="" class="sites__flower" />
        </button>
        <a class="sites__there" id="goKanji"
           href="https://msahakyan524.github.io/minnanokanji/"
           title="Minnaa no Kanji" aria-label="Go to Minnaa no Kanji">
          <img src="kanji-flower.svg" alt="" class="sites__flower" />
        </a>
      </div>

    </div>
  </header>

  <main class="main">

    <!-- ===== HOME: pick many lessons (drag to select) ===== -->
    <section class="view view--home" data-screen="home">
      <div class="hero">
        <!-- Site name, mirroring the kanji sister's "Միննա の 漢字": the word
             mark, then the flower that carries the 語彙 itself. -->
        <p class="hero__brand"><span>Միննա の</span><img src="favicon.svg" alt="語彙" /></p>
        <h1 class="hero__title" data-i18n="home_title">Choose what to study</h1>
        <p class="hero__sub" data-i18n="home_sub">Drag your finger across lessons to grab several at once. Mix N5 and N4 freely.</p>
      </div>
      <div id="booksWrap" class="books"></div>
    </section>

    <!-- ===== SPECIFY WORDS ===== -->
    <section class="view view--specify" data-screen="specify">
      <div class="subhead">
        <button class="back" data-goto="home">←</button>
        <h2 data-i18n="specify_title">Pick exact words</h2>
      </div>
      <div class="specify-tools">
        <input id="wordSearch" class="search" type="search" placeholder="Search…" />
        <button class="mini" id="selectAllWords" data-i18n="select_all">Select all</button>
        <button class="mini" id="clearWords" data-i18n="clear">Clear</button>
      </div>
      <div id="specifyList" class="specify-list"></div>
    </section>

    <!-- ===== LESSONS: pick a single lesson ===== -->
    <section class="view view--lessons" data-screen="lessons">
      <div class="subhead">
        <button class="back" data-goto="home">←</button>
        <h2 data-i18n="lessons_title">Study one lesson</h2>
      </div>
      <div id="singleBooks" class="books books--single"></div>
      <div id="lessonPreview" class="lesson-preview" hidden></div>
    </section>

    <!-- ===== FLASHCARDS ===== -->
    <section class="view view--cards" data-screen="cards">
      <div class="subhead">
        <button class="back" data-goto="home">←</button>
        <div class="deck-meta">
          <span id="deckTitle">Deck</span>
          <span id="deckProgress" class="deck-progress">0 / 0</span>
        </div>
        <button class="mini" id="shuffleBtn"><span data-i18n="shuffle">Shuffle</span></button>
      </div>

      <div class="card-zone">
        <div id="cardZoneStudy">
          <div class="card-stage" id="cardStage">
            <button class="icon-btn sound-btn" id="soundBtn" aria-label="Play pronunciation" title="Play pronunciation" hidden>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
                <path d="M4 9v6h4l5 5V4L8 9H4z"/>
                <path d="M16.5 8.5a5 5 0 0 1 0 7"/>
                <path d="M19 6a9 9 0 0 1 0 12"/>
              </svg>
            </button>
            <div class="flashcard" id="flashcard">
              <button class="icon-btn fav-btn" id="favBtn" aria-label="Add to favorites" title="Add to favorites">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
                  <polygon points="12 2 15 9 22 9.5 16.5 14 18 21 12 17.5 6 21 7.5 14 2 9.5 9 9"/>
                </svg>
              </button>
              <div class="swipe-badge swipe-badge--known" id="badgeKnown"><span data-i18n="known">Known</span></div>
              <div class="swipe-badge swipe-badge--again" id="badgeAgain"><span data-i18n="review">Review</span></div>
              <div class="flashcard__inner">
                <div class="flashcard__face flashcard__front" id="cardFront"></div>
                <div class="flashcard__face flashcard__back" id="cardBack"></div>
              </div>
            </div>
            <p class="tap-hint" data-i18n="tap_hint">Tap to flip · up: know, down: don't know</p>
          </div>

          <div class="card-controls" id="cardControls">
            <button class="round" id="prevBtn" aria-label="Previous">‹</button>
            <button class="flip" id="flipBtn" data-i18n="flip">Flip</button>
            <button class="round" id="nextBtn" aria-label="Next">›</button>
          </div>
        </div>

        <div class="deck-done" id="deckDone" hidden>
          <h3 id="doneTitle">Session done</h3>
          <div id="doneGraphic" class="done-graphic"></div>
          <p id="doneSub" class="deck-done__sub"></p>
          <div class="deck-done__btns">
            <button class="btn btn--primary" id="reviewAgainBtn" hidden></button>
            <button class="btn btn--ghost" id="restartBtn"></button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- ===== Sticky action bar (home / specify) ===== -->
  <div class="actionbar" id="actionbar">
    <div class="actionbar__count">
      <span id="selCount">0</span> <span data-i18n="words_selected">words selected</span>
      <button class="linkbtn" id="deselectAllBtn" data-i18n="deselect_all" hidden>Deselect all</button>
    </div>
    <div class="actionbar__btns">
      <button class="btn btn--ghost" id="specifyBtn" data-i18n="specify_btn">Specify words</button>
      <button class="btn btn--primary" id="studyBtn" data-i18n="study_btn">Study →</button>
    </div>
  </div>

  <!-- ===== Account panel ===== -->
  <div class="acc-modal" id="acc-modal" hidden>
    <div class="acc-sheet" role="dialog" aria-modal="true" aria-labelledby="acc-title">
      <div class="acc-bar">
        <h2 id="acc-title">Account</h2>
        <button class="acc-x" id="acc-close" aria-label="Close">✕</button>
      </div>
      <p class="acc-msg" id="acc-msg"></p>
      <div id="acc-body"></div>
    </div>
  </div>

  <!-- ===== イロバコ, set vertically down the right edge =====
       The two sister sites share one name. It sits in the empty gutter beside
       the 960px content column, the way a shop sign hangs beside a doorway, and
       hides once the window is too narrow for that gutter to exist. -->
  <div class="edgemark" aria-hidden="true">
    <svg viewBox="0 0 84 292" role="img">
      <g font-family="'Shippori Mincho','Noto Serif JP',serif" font-size="56"
         text-anchor="middle" fill="currentColor">
        <text x="34" y="62">イ</text>
        <text x="34" y="132">ロ</text>
        <text x="34" y="202">ハ</text>
        <text x="34" y="272">コ</text>
      </g>
      <!-- the dakuten on the ハ, as two sakura petals -->
      <g transform="translate(58,186) rotate(-28) scale(.48) translate(-10,-40)">
        <path d="M10 40 C0 34 -0.5 17 3.5 8.5 C5.5 3.5 9 2.5 9.3 8 L10 11.5 L10.7 8
                 C11 2.5 14.5 3.5 16.5 8.5 C20.5 17 20 34 10 40 Z"
              fill="#7c83ff" stroke="#5a61e6" stroke-width="2.3" stroke-linejoin="round"/></g>
      <g transform="translate(58,186) rotate(22) scale(.48) translate(-10,-40)">
        <path d="M10 40 C0 34 -0.5 17 3.5 8.5 C5.5 3.5 9 2.5 9.3 8 L10 11.5 L10.7 8
                 C11 2.5 14.5 3.5 16.5 8.5 C20.5 17 20 34 10 40 Z"
              fill="#ff8fbb" stroke="#c2185b" stroke-width="2.3" stroke-linejoin="round"/></g>
    </svg>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/avatars.js?v=48"></script>
  <script src="js/data.js?v=48"></script>
  <script src="js/words2.js?v=48"></script>
  <script src="js/images.js?v=48"></script>
  <script src="js/app.js?v=48"></script>
  <script src="js/cloud.js?v=48"></script>
</body>
</html>
